apiVersion: apps/v1
kind: Deployment
metadata:
  name: eggmail
spec:
  template:
    spec:
      containers:
        - name: eggmail
          env:
            - { name: Dns__Servers__0, value: "127.0.0.1" }
            - { name: Dns__RequestDnssec, value: "true" }
            - { name: Dns__TrustAuthenticatedData, value: "true" }
        - name: unbound
          image: klutchell/unbound:1.26.1
          imagePullPolicy: IfNotPresent
          ports:
            - { name: dns-udp, containerPort: 53, protocol: UDP }
          readinessProbe:
            exec:
              command: ["drill-hc", "@127.0.0.1", "dnssec.works"]
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 10
          securityContext:
            runAsNonRoot: false             # the pod default is non-root; Unbound binds port 53 as root, then drops to its own user
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE, SETUID, SETGID]
