name: ci

on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.github/FUNDING.yml']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.github/FUNDING.yml']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      EGGMAIL_TEST_POSTGRES: Host=localhost;Port=5432;Username=eggmail;Password=eggmail;Database=postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Cheapest checks first (seconds): the deployment files and the scripts the release workflow runs. The full test of the
      # files against a real image happens in the release workflow (deploy/smoke).
      - name: Deployment files and scripts (static checks)
        run: |
          shellcheck deploy/smoke/*.sh .github/scripts/*.sh
          python3 -m py_compile deploy/smoke/smoke.py bench/compare-allocations.py bench/measure-startup.py bench/summarize-throughput.py bench/compare/provision_eggmail.py
          export EGGMAIL_HOSTNAME=mail.example.com EGGMAIL_DB_PASSWORD=x SMOKE_HOST_IP=127.0.0.1
          docker compose -f deploy/compose/compose.yaml config --quiet
          docker compose -f deploy/compose/compose.postgres.yaml config --quiet
          docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.unbound.yaml config --quiet
          docker compose -f deploy/compose/compose.postgres.yaml -f deploy/compose/compose.unbound.yaml -f deploy/smoke/compose.smoke.yaml config --quiet
          docker compose -f bench/compare/compose.yaml --profile eggmail --profile postfix --profile kumomta --profile load config --quiet
          docker compose -f bench/compare/compose.yaml -f bench/compare/compose.postfix-tmpfs.yaml --profile postfix config --quiet
          kustomize build deploy/kubernetes/sqlite > /dev/null
          kustomize build deploy/kubernetes/postgres > /dev/null
          # the Unbound component on both variants (an overlay next to the others, because kustomize refuses paths outside its root)
          for variant in sqlite postgres; do
            overlay=$(mktemp -d -p deploy/kubernetes)
            printf 'apiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources:\n  - ../%s\ncomponents:\n  - ../components/unbound\n' "$variant" > "$overlay/kustomization.yaml"
            kustomize build "$overlay" > "$overlay/rendered.yaml"
            grep -q 'name: unbound' "$overlay/rendered.yaml"
            rm -r "$overlay"
          done
      # A plain `docker run` instead of a service container so the server can take flags: several test projects run in
      # parallel against it and the default max_connections=100 ran out ("53300: too many clients"). fsync=off is fine for tests.
      - name: PostgreSQL 17 for the tests
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=eggmail -e POSTGRES_PASSWORD=eggmail -e POSTGRES_DB=postgres postgres:17 \
            -c max_connections=600 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for i in $(seq 1 30); do docker exec pg pg_isready -U eggmail && break || sleep 1; done
      # Let's Encrypt's Pebble test CA and its challenge test server for the ACME integration tests (tests/Mta.Integration.Tests/Acme).
      # Host networking so Pebble reaches the DNS server (:8053) of the challenge test server on 127.0.0.1. PEBBLE_VA_NOSLEEP drops the random
      # 1-5 s validation delay, PEBBLE_WFE_NONCEREJECT=0 and PEBBLE_AUTHZREUSE=100 make the CA deterministic (no random bad nonces; a valid
      # authorization is always reused. 0 would not disable reuse: Pebble reuses at random in 1 % of the orders even then). Challenges are really validated (DNS-01 against pebble-challtestsrv): no PEBBLE_VA_ALWAYS_VALID.
      - name: Pebble ACME test CA for the ACME tests
        run: |
          docker run -d --name challtestsrv --network host ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1 \
            -http01 "" -https01 "" -tlsalpn01 "" -doh ""
          docker run -d --name pebble --network host -e PEBBLE_VA_NOSLEEP=1 -e PEBBLE_WFE_NONCEREJECT=0 -e PEBBLE_AUTHZREUSE=100 \
            ghcr.io/letsencrypt/pebble:2.10.1 -config test/config/pebble-config.json -dnsserver 127.0.0.1:8053
          docker cp pebble:/test/certs/pebble.minica.pem "$RUNNER_TEMP/pebble.minica.pem"
          for i in $(seq 1 30); do curl -sf --cacert "$RUNNER_TEMP/pebble.minica.pem" https://localhost:14000/dir >/dev/null && break || sleep 1; done
          curl -sf --cacert "$RUNNER_TEMP/pebble.minica.pem" https://localhost:14000/dir >/dev/null || { docker logs pebble; exit 1; }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore EggMail.slnx
      - name: Build
        run: dotnet build EggMail.slnx -c Release --no-restore
      - name: Test
        env:
          EGGMAIL_TEST_ACME_DIRECTORY: https://localhost:14000/dir
          EGGMAIL_TEST_ACME_CA_FILE: ${{ runner.temp }}/pebble.minica.pem
        run: dotnet test EggMail.slnx -c Release --no-build --logger "trx;LogFileName=test.trx" --results-directory TestResults
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Dashboard (install without scripts, verify signatures, lint, test, build, CSP check)
        working-directory: dashboard
        run: |
          npm ci --ignore-scripts
          npm audit signatures
          npm run lint
          npm test
          npm run build
          npm run check-csp
      # Real-browser end-to-end tests (Chromium) against the real server: they run after the unit tests and reuse the Release build and the
      # dashboard build above. The PostgreSQL service of this job is the target of the storage-switch tests.
      - name: Playwright version
        id: playwright
        working-directory: dashboard
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for Playwright
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Dashboard end-to-end tests (real server, real browser)
        working-directory: dashboard
        run: npx playwright test
      - name: Pebble logs on failure
        if: failure()
        run: docker logs pebble 2>&1 | tail -200 || true
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults
            dashboard/e2e-results
          retention-days: 3
