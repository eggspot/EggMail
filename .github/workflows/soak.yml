name: soak

# Soak test of the REAL host: `dotnet publish`, then `mta serve` on SQLite or a PostgreSQL 17 container, a sink MX and a DNS stub on loopback, sustained
# mixed-size load, kill -9 crash drills, backup + restore drills, a sample every minute, and a PASS/FAIL verdict from fixed criteria.
# Everything it does and every threshold is in docs/soak.md. Run it by hand:
#
#   gh workflow run soak --ref <branch> -f hours=2 -f backend=sqlite
#   gh workflow run soak --ref <branch> -f hours=0.33 -f backend=both -f crash_interval_min=4 -f backup_interval_min=5 -f quiet_tail=0.4 -f sample_interval_s=15 -f claim_lease_min=2   # a 20 minute proof per backend
#
# BILLING. One job on one standard ubuntu-latest runner, billed for its whole wall time rounded up to the minute: a 6 hour soak bills about 360 minutes
# (Linux, 1x). Nothing here runs on a push or a pull request. The scheduled run is OFF until the repository variable EGGMAIL_SOAK_SCHEDULE is
# set to 'true' (Settings, Secrets and variables, Actions, Variables); with it unset the schedule starts the workflow, the job is skipped and nothing is billed.
#
# LIMIT. A GitHub-hosted job may run 6 hours (360 minutes) including checkout, publish and the end-of-run drain. With backend=both the hours below
# are per backend and both run in this one job, so the total must still fit. A longer soak needs a self-hosted runner (the same script runs there),
# or chained runs: start the next dispatch when this one ends; each run is judged on its own (docs/soak.md).

on:
  push:   # TEMPORARY: proof run from the feature branch (a new workflow cannot be dispatched before it is on the default branch); removed again before merge
    branches: [feat/soak-bench-workflows]
  workflow_dispatch:
    inputs:
      hours:
        description: Hours of load per backend (the job is limited to 6 h in all; with backend=both both runs share that)
        default: '2'
      backend:
        description: Storage backend under test; both runs SQLite, then PostgreSQL 17, one after the other in this job
        type: choice
        options: [sqlite, postgres, both]
        default: sqlite
      history:
        description: History:Mode
        type: choice
        options: [full, statsonly]
        default: full
      sync:
        description: SQLite Sqlite:SyncMode; for PostgreSQL off sets synchronous_commit=off, normal and full keep the durable default
        type: choice
        options: [off, normal, full]
        default: off
      rate:
        description: Messages per second submitted, in total
        default: '30'
      size_mix:
        description: 'Message sizes in bytes and weights, "bytes:weight,..."'
        default: '1024:55,8192:30,65536:12,524288:3'
      connections:
        description: Concurrent submission connections
        default: '8'
      crash_interval_min:
        description: Minutes between kill -9 drills (0 turns them off)
        default: '20'
      backup_interval_min:
        description: Minutes between backup and restore drills (0 turns them off)
        default: '30'
      quiet_tail:
        description: Fraction of the run at its end without drills (the stretch the memory, descriptor and thread trends are judged on)
        default: '0.25'
      sample_interval_s:
        description: Seconds between samples
        default: '60'
      claim_lease_min:
        description: Delivery:ClaimLease in minutes (0 keeps the product default of 15); a short value lets a short proof run see crash recovery
        default: '0'
  # Rare and off by default: needs the repository variable EGGMAIL_SOAK_SCHEDULE=true (see BILLING above). Monthly, 2 hours of SQLite.
  schedule:
    - cron: '23 3 1 * *'

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  soak:
    if: github.event_name != 'schedule' || vars.EGGMAIL_SOAK_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Plan (does it fit in one job?)
        id: plan
        env:
          HOURS: ${{ inputs.hours || '0.33' }}
          BACKEND: ${{ inputs.backend || 'both' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          hours = float(os.environ["HOURS"])
          backend = os.environ["BACKEND"]
          runs = 2 if backend == "both" else 1
          # 8 minutes of checkout, publish and start-up, 3 minutes of shutdown and reporting per run, and a drain of at least 5 minutes per run
          minutes = 8 + runs * (hours * 60 + 3 + 5)
          print("load per backend: %.2f h, runs: %d, planned job time without a long drain: %.0f min (limit 358)" % (hours, runs, minutes))
          if hours <= 0 or minutes > 340:
              sys.exit("This does not fit in one hosted job (6 h limit). Lower hours, run the backends in separate dispatches, or use a self-hosted runner (docs/soak.md).")
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write("runs=%d\n" % runs)
              handle.write("load_minutes=%d\n" % round(hours * 60 * runs))
          PY

      - name: Machine
        run: |
          echo "cores: $(nproc)"; grep -m1 'model name' /proc/cpuinfo || true; free -m | head -2; df -h . | tail -1
          python3 --version; ulimit -n

      - name: Soak
        timeout-minutes: 345
        env:
          HOURS: ${{ inputs.hours || '0.33' }}
          BACKEND: ${{ inputs.backend || 'both' }}
          HISTORY: ${{ inputs.history || 'full' }}
          SYNC: ${{ inputs.sync || 'off' }}
          RATE: ${{ inputs.rate || '30' }}
          SIZE_MIX: ${{ inputs.size_mix || '1024:55,8192:30,65536:12,524288:3' }}
          CONNECTIONS: ${{ inputs.connections || '8' }}
          CRASH_INTERVAL_MIN: ${{ inputs.crash_interval_min || '4' }}
          BACKUP_INTERVAL_MIN: ${{ inputs.backup_interval_min || '5' }}
          QUIET_TAIL: ${{ inputs.quiet_tail || '0.4' }}
          SAMPLE_INTERVAL_S: ${{ inputs.sample_interval_s || '15' }}
          CLAIM_LEASE_MIN: ${{ inputs.claim_lease_min || '2' }}
        run: |
          set -uo pipefail
          started=$(date +%s)
          backends=("$BACKEND"); [ "$BACKEND" != both ] || backends=(sqlite postgres)
          mkdir -p soak-results
          status=0
          for b in "${backends[@]}"; do
            # The drain after the load may take up to 30 minutes in the worst case; never more than the job has left (345 minute step limit).
            used=$(( ($(date +%s) - started) / 60 ))
            this_load=$(python3 -c "print(int(float('$HOURS') * 60))")
            drain=$(( 340 - used - this_load - 6 )); [ "$drain" -le 30 ] || drain=30; [ "$drain" -ge 5 ] || drain=5
            echo "::group::soak $b ($HOURS h, drain limit $drain min)"
            bench/soak/run-soak.sh --skip-build --hours "$HOURS" --backend "$b" --history "$HISTORY" --sync "$SYNC" --rate "$RATE" --size-mix "$SIZE_MIX" \
              --connections "$CONNECTIONS" --crash-interval-min "$CRASH_INTERVAL_MIN" --backup-interval-min "$BACKUP_INTERVAL_MIN" --quiet-tail "$QUIET_TAIL" \
              --sample-interval-s "$SAMPLE_INTERVAL_S" --claim-lease-min "$CLAIM_LEASE_MIN" --drain-timeout-min "$drain" --pg-mode docker --out "soak-results/$b" \
              || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          label="GitHub-hosted ubuntu-latest $(nproc)-core runner, noisy, not publishable"
          echo "**$label**" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          for f in soak-results/*/summary.md; do
            [ -f "$f" ] && { cat "$f"; echo; } >> "$GITHUB_STEP_SUMMARY"
          done
          ls soak-results/*/ 2>/dev/null || true

      - name: Upload the CSV, logs and summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: soak-results-${{ github.run_id }}
          # The data directories, restored copies and the throwaway password are not evidence; everything else (samples.csv, events.jsonl,
          # ack.log, load-stats.jsonl, host.log, load.log, verification.json, verdict.json, summary.md, config.json) is.
          path: |
            soak-results
            !soak-results/*/data/**
            !soak-results/*/restore-*/**
            !soak-results/*/admin-password.txt
          retention-days: 14
          if-no-files-found: warn
