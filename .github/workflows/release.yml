name: release

# Publishes the single image to ghcr.io/eggspot/eggmail (docs/release.md).
#   - tag push vMAJOR.MINOR.PATCH[-pre]  -> v1.4.2, 1.4, latest (stable only) + GitHub Release
#   - daily schedule                      -> nightly (only when main changed since the last nightly)
#   - workflow_dispatch                   -> manual run of the current ref (published as nightly-<sha> unless a tag)
# Cost rules: one job on ubuntu-latest, cheapest checks first, tight timeout, never cancel a release mid-flight.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  IMAGE: ghcr.io/eggspot/eggmail
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # create the GitHub Release
      packages: write        # push to GHCR with GITHUB_TOKEN (no PAT)
      id-token: write        # attestations
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Nightly gate (skip when this commit already has a nightly)
        id: gate
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .nightly-marker
          key: nightly-built-${{ github.sha }}
          lookup-only: true

      - name: Validate tag and version
        if: steps.gate.outputs.cache-hit != 'true' && (startsWith(github.ref, 'refs/tags/v'))
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag $tag is not vMAJOR.MINOR.PATCH[-pre]"; exit 1; }
          props=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          [ "v$props" = "$tag" ] || { echo "::error::Directory.Build.props Version ($props) does not match tag $tag"; exit 1; }

      - name: Was the ci workflow green for this exact commit?
        if: steps.gate.outputs.cache-hit != 'true'
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success" --jq '.total_count')
          echo "green=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ci green for ${GITHUB_SHA}: ${n:-0} successful run(s)"

      - uses: actions/setup-dotnet@v4
        if: steps.gate.outputs.cache-hit != 'true' && steps.ci.outputs.green != 'true'
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        if: steps.gate.outputs.cache-hit != 'true' && steps.ci.outputs.green != 'true'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build and test (only when ci has not already passed on this commit; saves the duplicate run)
        if: steps.gate.outputs.cache-hit != 'true' && steps.ci.outputs.green != 'true'
        run: |
          dotnet restore EggMail.slnx
          dotnet build EggMail.slnx -c Release --no-restore
          dotnet test EggMail.slnx -c Release --no-build

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.cache-hit != 'true'
      - uses: docker/login-action@v3
        if: steps.gate.outputs.cache-hit != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assembly and image version (a valid SemVer, the tag or the props version with a nightly pre-release)
        if: steps.gate.outputs.cache-hit != 'true'
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"
          else v="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)-nightly.g${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Image tags and labels
        if: steps.gate.outputs.cache-hit != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=raw,value=nightly-{{sha}},enable=${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/eggspot/EggMail

      - name: Build and push (linux/amd64, linux/arm64) with SBOM and provenance
        if: steps.gate.outputs.cache-hit != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        if: steps.gate.outputs.cache-hit != 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Smoke test the pushed image
        if: steps.gate.outputs.cache-hit != 'true'
        run: |
          docker run -d --name smoke -p 8080:8080 "${IMAGE}@${{ steps.build.outputs.digest }}"
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break || sleep 2; done
          curl -fsS http://localhost:8080/api/v1/capabilities | tee capabilities.json
          docker logs smoke 2>&1 | grep -i "synchronous=OFF" || { echo "::error::startup warning for synchronous=OFF missing"; docker logs smoke; exit 1; }
          docker rm -f smoke

      - name: Remember nightly build
        if: github.event_name == 'schedule' && steps.gate.outputs.cache-hit != 'true'
        run: echo "${{ github.sha }}" > .nightly-marker
      - name: Save nightly marker
        if: github.event_name == 'schedule' && steps.gate.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .nightly-marker
          key: nightly-built-${{ github.sha }}

      - name: GitHub Release (stable and pre-release tags)
        if: steps.gate.outputs.cache-hit != 'true' && (startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "${IMAGE}@${{ steps.build.outputs.digest }}" > image-digest.txt
          sha256sum image-digest.txt > checksums.txt
          flags=""
          [[ "${GITHUB_REF_NAME}" == *-* ]] && flags="--prerelease"
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes $flags image-digest.txt checksums.txt
