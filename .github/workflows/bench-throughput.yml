name: bench-throughput

# Manual throughput run of the pipeline harness (SMTP ingest through storage, and end-to-end delivery to a sink) for BOTH backends, each durable and
# non-durable (SQLite Sync=Off, Normal, Full; PostgreSQL synchronous_commit=off and the default), published as a workflow artifact and a markdown
# summary that reports every pair side by side. Dispatch only; billed by the minute: about 25 to 40 minutes of runner time with the defaults.
# The same matrix runs on a laptop with bench/run-local-matrix.sh (docs/benchmarks.md).
#
#   gh workflow run bench-throughput --ref <branch> [-f messages=30000 -f runs=3 -f postgres=true -f readytorun=true]
#
# A GitHub-hosted ubuntu-latest runner has 2 to 4 cores depending on the repository (4 for this public repository on 2026-10-13), shares its
# host with other jobs, and here also runs the load generator, the server, the sink and PostgreSQL. The summary names the core count the
# runner really has (nproc), never an assumed one. The numbers are for trends and for catching order-of-magnitude mistakes, NOT for publication or for
# comparing with other servers (docs/benchmarks.md, fairness rules). The summary says so in its first line.

on:
  workflow_dispatch:
    inputs:
      messages:
        description: Messages per ingest run
        default: '30000'
      runs:
        description: Runs per configuration (the summary reports the median)
        default: '3'
      postgres:
        description: Also measure the PostgreSQL backend (default durability and synchronous_commit=off)
        type: boolean
        default: true
      readytorun:
        description: Also measure start-up time and size of a JIT versus a ReadyToRun publish (decides the Docker build argument)
        type: boolean
        default: true

concurrency:
  group: bench-throughput-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  throughput:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The inputs reach the steps below as plain `${{ inputs.x }}` (no `||` default: a falsy value would silently become the default; the boolean inputs
      # are real booleans). bench/soak/plan.py --self-test, run by ci, checks this file for unquoted YAML 1.1 words such as `off`.
      - name: Check the inputs
        env:
          MESSAGES: ${{ inputs.messages }}
          RUNS: ${{ inputs.runs }}
        run: |
          for pair in "messages=$MESSAGES" "runs=$RUNS"; do
            case "${pair#*=}" in ''|*[!0-9]*) echo "::error title=bench-throughput inputs::${pair%%=*} must be a whole number, got '${pair#*=}'"; exit 2 ;; esac
          done
          if [ "$MESSAGES" -lt 3000 ] || [ "$RUNS" -lt 1 ] || [ "$RUNS" -gt 10 ]; then
            echo "::error title=bench-throughput inputs::messages must be at least 3000 and runs from 1 to 10 (got $MESSAGES and $RUNS)"; exit 2
          fi

      - name: Build the harness and the load generator
        run: dotnet build bench/Mta.Bench.Pipeline -c Release

      - name: Machine
        run: |
          echo "cores: $(nproc)"; grep -m1 'model name' /proc/cpuinfo || true; free -m | head -2; df -h . | tail -1
          mount | grep -E ' / ' || true

      - name: Publish the harness with ReadyToRun (for the JIT versus ReadyToRun throughput comparison)
        if: inputs.readytorun
        run: dotnet publish bench/Mta.Bench.Pipeline -c Release -r linux-x64 --self-contained false -p:PublishReadyToRun=true -o publish-bench-r2r -v q

      # bench/run-local-matrix.sh is the one definition of the matrix (the same script runs on a laptop): SQLite Sync=Off, Normal and Full, PostgreSQL 17
      # (container) with synchronous_commit=off and the durable default, history Full and StatsOnly, ingest and end-to-end delivery. Runs are interleaved.
      - name: Matrix, both backends, each durable and non-durable
        env:
          MESSAGES: ${{ inputs.messages }}
          RUNS: ${{ inputs.runs }}
          POSTGRES: ${{ inputs.postgres }}
          BENCH_LABEL: GitHub-hosted ubuntu-latest runner, noisy, not publishable
        run: |
          set -euo pipefail
          pg=skip; [ "$POSTGRES" != "true" ] || pg=docker
          bench/run-local-matrix.sh --messages "$MESSAGES" --runs "$RUNS" --postgres "$pg" --out results

      - name: JIT versus ReadyToRun ingest (the sqlite-off-full-ingest configuration with precompiled application assemblies)
        if: inputs.readytorun
        env:
          MESSAGES: ${{ inputs.messages }}
          RUNS: ${{ inputs.runs }}
        run: |
          set -euo pipefail
          for n in $(seq 1 "$RUNS"); do
            echo "== sqlite-off-full-ingest-r2r run $n"
            EGGMAIL_BENCH_TOOLS="$PWD/src/Mta.Tools/bin/Release/net10.0/mta-tools.dll" \
              dotnet publish-bench-r2r/Mta.Bench.Pipeline.dll --sync off --history full --deliver false --connections 16 --size 2048 --messages "$MESSAGES" \
              --label sqlite-off-full-ingest-r2r --json "results/sqlite-off-full-ingest-r2r.run${n}.json" | tail -n 4
          done

      - name: Start-up time and size, JIT versus ReadyToRun (linux-x64), and the linux-arm64 cross-publish
        if: inputs.readytorun
        run: |
          set -euo pipefail
          # Restore first (with the ReadyToRun compiler package, a download), so the timed publishes below compare the build work only.
          dotnet restore src/Mta.Host/Mta.Host.csproj -r linux-x64 -p:PublishReadyToRun=true -v q
          dotnet build src/Mta.Host/Mta.Host.csproj -c Release -r linux-x64 --no-restore -v q   # the shared compile, so publish times the publish work
          for mode in false true; do
            started=$(date +%s%N)
            dotnet publish src/Mta.Host/Mta.Host.csproj -c Release -r linux-x64 --no-restore --self-contained false -p:PublishReadyToRun=$mode -p:DebugType=none -o "publish-x64-r2r-$mode" -v q
            echo "PublishReadyToRun=$mode: publish took $(( ($(date +%s%N) - started) / 1000000 )) ms" | tee -a results/publish-times.txt
          done
          python3 bench/measure-startup.py publish-x64-r2r-false --runs 7 --label "linux-x64 JIT (PublishReadyToRun=false)" | tee results/startup-jit.txt
          python3 bench/measure-startup.py publish-x64-r2r-true  --runs 7 --label "linux-x64 ReadyToRun (PublishReadyToRun=true)" | tee results/startup-r2r.txt
          # The image is built for arm64 on an amd64 runner: the ReadyToRun compiler has to cross-compile. Proves it builds and shows the size.
          dotnet publish src/Mta.Host/Mta.Host.csproj -c Release -r linux-arm64 --self-contained false -p:PublishReadyToRun=true -p:DebugType=none -o publish-arm64-r2r -v q
          du -sm publish-arm64-r2r | tee results/arm64-r2r-size.txt

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          label="GitHub-hosted ubuntu-latest $(nproc)-core runner, noisy, not publishable"
          python3 bench/summarize-throughput.py results "$label" > summary.md
          if [ -f results/startup-jit.txt ]; then
            {
              echo
              echo "### Start-up and size, JIT versus ReadyToRun (same runner, median of 7 starts)"
              echo
              echo '```json'
              cat results/startup-jit.txt results/startup-r2r.txt
              echo '```'
              echo "Publish step wall time on this runner (restore and compile already done): $(paste -sd ';' results/publish-times.txt)"
              echo
              echo "linux-arm64 ReadyToRun cross-publish from this amd64 runner succeeded: $(cut -f1 results/arm64-r2r-size.txt) MiB."
            } >> summary.md
          fi
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          cp summary.md results/summary.md

      - name: Publish the results as an artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: throughput-results-${{ github.run_id }}
          path: results
          retention-days: 30
